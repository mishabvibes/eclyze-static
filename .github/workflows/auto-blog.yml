name: Auto Blog Post

on:
  # Twice a week — Monday and Thursday, ~10:30am IST (05:00 UTC).
  # Adjust the cron to taste; keep it modest so content doesn't
  # outpace real editorial quality control on a fully automated pipeline.
  schedule:
    - cron: "0 5 * * 1,4"
  # Lets you trigger a run manually from the Actions tab, useful for
  # testing or publishing on demand.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit and push if a new post was created
        run: |
          git config user.name "eclyze-auto-blog"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new content — nothing to publish."
          else
            git commit -m "chore: auto-publish blog post [skip ci]"
            git push
          fi
